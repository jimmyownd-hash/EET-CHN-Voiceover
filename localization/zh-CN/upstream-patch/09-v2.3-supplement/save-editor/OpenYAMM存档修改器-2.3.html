<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魔法门重生 存档工坊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a forge-ledger — save screenshot as the banner, brass-trimmed stone panels,
   party roster on the left, the selected hero's sheet on the right; gems colour the nine schools. */
:root {
  --bg: #15110e;          /* smoke-stained stone */
  --panel: #1e1915;
  --panel-2: #29221b;
  --line: #3d3228;
  --brass: #cfa65c;
  --brass-dim: #8b6c3b;
  --text: #efe6d6;
  --muted: #a8998a;
  --good: #7fb86a;
  --warn: #e0a345;
  --bad: #d65a45;
  --fire: #e2603f; --air: #8fc7e8; --water: #4f8fe0; --earth: #c79a52; --spirit: #e8cf6a;
  --mind: #b28ae6; --body: #e486a0; --light: #f3ecd0; --dark: #8f6bb5; --other: #9fb3a6;
  --f-display: "ZCOOL XiaoWei", "STKaiti", "KaiTi", "Songti SC", serif;
  --f-latin: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --f-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --r: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: var(--f-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
  background-image:
    radial-gradient(1200px 500px at 50% -200px, rgba(207,166,92,.10), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: linear-gradient(var(--bg) 70%, rgba(21,17,14,0));
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px 18px; }
.mark { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.mark svg { flex: none; }
.mark h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: .06em; line-height: 1.1; }
.mark small { display: block; font-family: var(--f-latin); font-size: 10.5px; letter-spacing: .32em; color: var(--brass); }
.btn { border: 1px solid var(--brass-dim); background: var(--panel-2); border-radius: var(--r); padding: 8px 14px; cursor: pointer;
  transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { border-color: var(--brass); background: #33291f; }
.btn.primary { background: linear-gradient(#d9b26a, #b38a45); color: #1c140b; border-color: #e6c27e; font-weight: 700; }
.btn.primary:hover { background: linear-gradient(#e6c27e, #c49650); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* hero */
.hero { position: relative; border: 1px solid var(--brass-dim); border-radius: 10px; overflow: hidden; min-height: 230px;
  background: #0d0b09 center/cover no-repeat; box-shadow: 0 0 0 4px #0f0c0a, 0 0 0 5px var(--line), 0 18px 40px rgba(0,0,0,.45); }
.hero img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) contrast(1.05); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,12,10,.92) 0%, rgba(15,12,10,.72) 38%, rgba(15,12,10,.1) 75%); }
.hero .info { position: relative; z-index: 1; padding: 26px 28px; max-width: 560px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--f-latin); font-size: 11px; letter-spacing: .3em; color: var(--brass); text-transform: uppercase; }
.hero h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.facts b { color: var(--text); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--brass-dim); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--brass); background: rgba(0,0,0,.35); }
.pill.demo { border-color: var(--warn); color: var(--warn); }

/* treasury */
.treasury { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: stretch; }
.coin { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.coin label { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.coin input { width: 100%; background: transparent; border: 0; border-bottom: 1px dashed var(--brass-dim); font-family: var(--f-latin); font-size: 22px; font-weight: 700; color: var(--brass); padding: 2px 0; }
.coin input:focus { outline: none; border-bottom-color: var(--brass); }
.quick { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.quick .row { display: flex; flex-wrap: wrap; gap: 6px; }

/* main grid */
.main { margin-top: 22px; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
.roster { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); }
.roster h3, .sheet h3 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: .08em; color: var(--brass); }
.hero-card { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; gap: 4px 10px; align-items: center; }
.hero-card:hover { border-color: var(--brass-dim); }
.hero-card[aria-selected="true"] { border-color: var(--brass); background: linear-gradient(90deg, #2e251b, var(--panel)); }
.sigil { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 19px; background: radial-gradient(circle at 35% 30%, #4a3b2a, #1b1510); border: 1px solid var(--brass-dim); color: var(--brass); grid-row: span 2; }
.hero-card .nm { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.hero-card .nm span { color: var(--muted); font-weight: 400; font-size: 12px; white-space: nowrap; }
.bars { display: grid; gap: 3px; }
.bar-hp, .bar-sp { height: 4px; border-radius: 2px; background: #2c241c; overflow: hidden; }
.bar-hp i, .bar-sp i { display: block; height: 100%; }
.bar-hp i { background: var(--bad); } .bar-sp i { background: var(--water); }
.hero-card .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; border-radius: 3px; padding: 0 6px; border: 1px solid currentColor; line-height: 18px; }
.chip.bad { color: var(--bad); } .chip.ok { color: var(--good); }

.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.sheet-head { padding: 18px 20px 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.sheet-head .who { margin-right: auto; display: grid; gap: 2px; }
.sheet-head input.name { background: transparent; border: 0; border-bottom: 1px dashed transparent; font-family: var(--f-display); font-size: 30px; padding: 0; width: 12ch; }
.sheet-head input.name:hover, .sheet-head input.name:focus { border-bottom-color: var(--brass-dim); outline: none; }
.sub { color: var(--muted); }
.tabs { display: flex; gap: 2px; padding: 14px 16px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--brass); border-bottom-color: var(--brass); }
.tab .n { font-size: 11px; color: var(--muted); margin-left: 4px; }
.pane { padding: 18px 20px 22px; display: grid; gap: 22px; }
.section-title { font-family: var(--f-display); font-size: 17px; color: var(--brass); display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-weight: 400; }
.section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.section-title .acts { display: flex; gap: 6px; order: 3; }
.hint { color: var(--muted); font-size: 12.5px; margin: -4px 0 10px; }

.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; font-variant-numeric: tabular-nums; }
.field input:focus, .field select:focus { border-color: var(--brass); outline: none; }
.field.changed input, .field.changed select, .coin.changed input { border-color: var(--warn); color: var(--warn); }
.field .ro { padding: 6px 0; font-variant-numeric: tabular-nums; }
.res .field label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--brass)); margin-right: 6px; vertical-align: 0; }

/* skills */
.skill-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 22px; }
.sg h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .2em; color: var(--muted); font-weight: 500; }
.sk { display: grid; grid-template-columns: 22px minmax(0, 1fr) 64px 82px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; }
.sk:nth-child(even) { background: rgba(255,255,255,.02); }
.sk.off .sk-name { color: var(--muted); }
.sk.off input[type="number"], .sk.off select { opacity: .35; }
.sk input[type="number"], .sk select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; width: 100%; font-variant-numeric: tabular-nums; }
.sk.changed .sk-name { color: var(--warn); }
input[type="checkbox"] { accent-color: var(--brass); width: 16px; height: 16px; }

/* spells */
.schools { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.school { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 9%, transparent), transparent 60%); }
.school header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.school header .gem { width: 12px; height: 12px; transform: rotate(45deg); background: var(--c); box-shadow: 0 0 10px var(--c); }
.school header b { font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--c); }
.school header .cnt { margin-left: auto; color: var(--muted); font-size: 12px; }
.spell-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.sp { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 2px 0; min-width: 0; }
.sp span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .lv { color: var(--muted); font-size: 11px; width: 16px; text-align: right; flex: none; }
.sp.changed span { color: var(--warn); }

/* conditions */
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.cond { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.cond.on { border-color: var(--bad); color: var(--bad); background: rgba(214,90,69,.08); }

/* items */
.items { display: grid; gap: 4px; }
.it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; }
.it .t { min-width: 0; }
.it .t b { font-weight: 500; }
.it .t small { color: var(--muted); margin-left: 8px; }
.it .flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 3px; line-height: 18px; border: 1px solid var(--line); color: var(--muted); }
.tag.warn { color: var(--warn); border-color: var(--warn); } .tag.bad { color: var(--bad); border-color: var(--bad); } .tag.art { color: var(--spirit); border-color: var(--spirit); }
.equip { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.slot { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 4px; background: var(--panel-2); min-width: 0; }
.slot em { font-style: normal; color: var(--muted); font-size: 12px; width: 4.5em; flex: none; }
.slot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.beacons { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.beacon { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.beacon canvas { width: 100%; display: block; aspect-ratio: 4 / 3; background: #000; max-width: 100%; }
.beacon .b { padding: 8px 10px; display: grid; gap: 4px; }

/* folder */
.folder { margin-top: 6px; }
.saves { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.save-card { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; cursor: pointer; padding: 0; display: grid; }
.save-card:hover { border-color: var(--brass); }
.save-card[aria-current="true"] { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
.save-card .th { aspect-ratio: 16 / 10; background: #0b0908 center/cover; max-width: 100%; }
.save-card .d { padding: 8px 10px 10px; display: grid; gap: 2px; }
.save-card .d b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.save-card .d span { color: var(--muted); font-size: 12px; }

/* change dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 12px;
  background: linear-gradient(rgba(21,17,14,0), var(--bg) 35%); pointer-events: none; }
.dock .in { pointer-events: auto; max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #231c15; border: 1px solid var(--brass-dim); border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.dock .msg { margin-right: auto; min-width: 0; }
.dock .msg b { color: var(--warn); }
.log { max-height: 220px; overflow: auto; width: 100%; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12.5px; display: grid; gap: 2px; }
.log div { display: flex; gap: 8px; } .log s { color: var(--muted); } .log ins { text-decoration: none; color: var(--warn); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 9; background: #2b2219; border: 1px solid var(--brass); border-radius: 8px; padding: 10px 16px; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.err { border-color: var(--bad); }
.empty { color: var(--muted); padding: 10px 0; }
.drop-hint { border: 1px dashed var(--brass-dim); border-radius: 8px; padding: 14px; color: var(--muted); text-align: center; }
body.dragging .drop-hint { border-color: var(--brass); color: var(--brass); }

@media (max-width: 860px) {
  .bar { position: static; }
  .mark h1 { font-size: 21px; } .mark small { letter-spacing: .18em; }
  .main { grid-template-columns: 1fr; }
  .roster { position: static; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .roster h3 { grid-column: 1 / -1; }
  .treasury { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .hero .info { padding: 18px; }
  .sk { grid-template-columns: 22px minmax(0, 1fr) 56px 72px; }
  .spell-list { grid-template-columns: 1fr; }
  .sheet-head input.name { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header class="bar wrap">
  <div class="mark">
    <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true">
      <circle cx="21" cy="21" r="19" fill="none" stroke="#cfa65c" stroke-width="1.2"/>
      <circle cx="21" cy="21" r="14.5" fill="none" stroke="#8b6c3b" stroke-width=".8"/>
      <path d="M21 5 L24 18 L37 21 L24 24 L21 37 L18 24 L5 21 L18 18 Z" fill="#cfa65c"/>
      <circle cx="21" cy="21" r="3" fill="#15110e"/>
    </svg>
    <div><h1>魔法门重生 · 存档工坊</h1><small>MIGHT AND MAGIC REBORN · SAVE FORGE</small></div>
  </div>
  <button class="btn" id="btnFolder" type="button">打开存档文件夹</button>
  <button class="btn ghost" id="btnFile" type="button">打开单个存档</button>
  <input type="file" id="fileInput" accept=".oysav" hidden>
</header>

<div class="wrap">
  <section class="folder" id="folderView" hidden>
    <h3 class="section-title" id="folderTitle">存档文件夹</h3>
    <div class="saves" id="saveGrid"></div>
  </section>

  <section class="hero" id="hero" style="margin-top:18px">
    <img class="shot" id="heroShot" alt="">
    <div class="info">
      <div class="eyebrow" id="heroEyebrow">OpenYAMM 存档</div>
      <h2 id="heroTitle">—</h2>
      <div class="facts" id="heroFacts"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="heroPills"></div>
    </div>
  </section>

  <section class="treasury" id="treasury"></section>

  <section class="main">
    <nav class="roster" id="roster" aria-label="队伍成员"></nav>
    <article class="sheet" id="sheet"></article>
  </section>

  <p class="drop-hint" style="margin-top:22px">也可以直接把 .oysav 存档拖到这个页面上。修改只写入存档里的队伍数据，其余内容原样保留；保存前会先校验，并自动备份原存档。</p>
</div>

<div class="dock"><div class="in" id="dock"></div></div>
<div class="toast" id="toast" hidden></div>

<script>// OpenYAMM 1.21 – 2.2 (.oysav, save versions 154–176) — party section codec.
// Mirrors the writeValue() order in game/maps/SaveGame.cpp. Everything after the
// fields we understand is kept as raw bytes, so a save round-trips byte-for-byte.
(function (root) {
  'use strict';
  const MAGIC = [0x4f, 0x59, 0x53, 0x41, 0x56, 0x45, 0x31, 0x00]; // "OYSAVE1\0"
  const MIN_VERSION = 154, MAX_VERSION = 179;
  // Version gates, as in game/maps/SaveGame.cpp (2.1).
  const V_WIDE_BAGS = 156, V_COND_EXPIRY = 159, V_STATS_ID = 163, V_BATTLE_ORDERS = 167, V_FLEET_FOOT = 168, V_UPKEEP = 176;
  let V = MAX_VERSION; // version of the save being read or written
  const CONDITION_COUNT = 18;
  const partyBuffCount = () => (V >= V_FLEET_FOOT ? 23 : 22);
  const CHARACTER_BUFF_COUNT = 28;
  const enc = new TextEncoder();
  const dec = new TextDecoder('utf-8', { fatal: true });

  class R {
    constructor(u8, pos) { this.u8 = u8; this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength); this.p = pos || 0; }
    need(n) { if (this.p + n > this.u8.length) throw new Error('存档数据提前结束（偏移 ' + this.p + '）'); }
    u8v() { this.need(1); return this.u8[this.p++]; }
    b() { const v = this.u8v(); if (v > 1) throw new Error('布尔值异常（偏移 ' + (this.p - 1) + '）'); return v === 1; }
    u16() { this.need(2); const v = this.dv.getUint16(this.p, true); this.p += 2; return v; }
    u32() { this.need(4); const v = this.dv.getUint32(this.p, true); this.p += 4; return v; }
    i32() { this.need(4); const v = this.dv.getInt32(this.p, true); this.p += 4; return v; }
    f32() { this.need(4); const v = this.dv.getFloat32(this.p, true); this.p += 4; return v; }
    f64() { this.need(8); const v = this.dv.getFloat64(this.p, true); this.p += 8; return v; }
    u64() { this.need(8); const v = this.dv.getBigUint64(this.p, true); this.p += 8; return v; }
    count() { const n = this.u64(); if (n > BigInt(this.u8.length - this.p)) throw new Error('数量字段异常（偏移 ' + (this.p - 8) + '）'); return Number(n); }
    bytes(n) { this.need(n); const v = this.u8.slice(this.p, this.p + n); this.p += n; return v; }
    str() { const n = this.count(); const raw = this.bytes(n); try { return dec.decode(raw); } catch (e) { return { raw }; } }
    vec(fn) { const n = this.count(); const a = new Array(n); for (let i = 0; i < n; i++) a[i] = fn(this); return a; }

function track(key, label, before, after) {

function clamp(v, [lo, hi]) { v = Math.round(Number(v)); if (!Number.isFinite(v)) v = 0; return Math.min(hi, Math.max(lo, v)); }

// ---------- loading ----------
async function gunzip(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip')));
  return new Uint8Array(await ds.arrayBuffer());
}
function loadBytes(bytes, name, opts = {}) {
  let save;
  try { save = OYSave.parse(bytes); } catch (e) { toast('读取失败：' + e.message, true); return false; }
  S.save = save; S.orig = OYSave.parse(bytes); S.bytes = bytes; S.fileName = name; S.demo = !!opts.demo;
  S.fileHandle = opts.handle || null; S.sel = Math.min(S.sel, save.members.length - 1); S.changes.clear(); S.showLog = false;
  renderAll();
  return true;
}
async function openFolder() {
  if (!window.showDirectoryPicker) { toast('这个浏览器不支持直接打开文件夹，请用 Chrome 或 Edge，或改用“打开单个存档”。', true); return; }
  try { S.dir = await window.showDirectoryPicker({ id: 'oysaves', mode: 'readwrite' }); } catch (e) { return; }
  await scanFolder();
}
async function scanFolder() {
  const list = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind !== 'file' || !/\.oysav$/i.test(name)) continue;
    const f = await h.getFile(); const bytes = new Uint8Array(await f.arrayBuffer());
    let info = { name, handle: h, modified: f.lastModified, ok: false };
    try {
      const sv = OYSave.parse(bytes); const ex = OYSave.summaryExtras(sv);
      info = Object.assign(info, { ok: true, saveName: ex.saveName, map: mapName(sv.summary.mapFileName), minutes: sv.summary.savedGameMinutes,
        thumb: ex.bmp ? URL.createObjectURL(new Blob([ex.bmp], { type: 'image/bmp' })) : null, level: Math.max(...sv.members.map(m => m.level)) });
    } catch (e) { info.err = e.message; }
    list.push(info);
  }
  list.sort((a, b) => b.modified - a.modified);
  S.folderEntries = list; renderFolder();
  const first = list.find(x => x.ok); if (first && (S.demo || !S.save)) await openEntry(first);
}
async function openEntry(entry) {
  if (S.changes.size && !entry._force) { pendingSwitch(entry); return; }
  const f = await entry.handle.getFile();
  if (loadBytes(new Uint8Array(await f.arrayBuffer()), entry.name, { handle: entry.handle })) renderFolder();
}
function pendingSwitch(entry) {
  toast(el('span', {}, '当前存档还有 ' + S.changes.size + ' 项改动没保存。 ', el('button', { class: 'btn small', type: 'button', onclick: () => { hideToast(); entry._force = true; openEntry(entry).then(() => { entry._force = false; }); } }, '放弃改动并切换')), false, 8000);
}

function actClearConditions() { S.save.members.forEach((m, i) => setConds(i, '0'.repeat(18))); toast('全队异常状态已解除。'); refreshAfterEdit(); }
function actIdentifyAll() { let n = 0; S.save.members.forEach((_, i) => { n += identifyMember(i); }); toast(n ? `鉴定和修复了 ${n} 件物品。` : '没有需要鉴定或修复的物品。'); refreshAfterEdit(); }
function actSkillPoints(d) { S.save.members.forEach((m, i) => { m.skillPoints = clamp(m.skillPoints + d, U32); track(`m${i}.skillPoints`, `${m.name}：技能点`, origMember(i).skillPoints, m.skillPoints); }); toast(`全队技能点 +${d}。`); refreshAfterEdit(); }
function actClearAging() { S.save.members.forEach((m, i) => { if (m.ageModifier > 0) { m.ageModifier = 0; track(`m${i}.ageModifier`, `${m.name}：魔法老化（年）`, origMember(i).ageModifier, 0); } }); toast('魔法老化已清除。'); refreshAfterEdit(); }

// ---------- dock / saving ----------
function renderDock() {
  const d = $('#dock'), n = S.changes.size;
  const canWrite = !S.demo && (S.fileHandle || S.dir);
  setKids(d, 
    el('div', { class: 'msg' }, n ? el('span', {}, el('b', {}, n + ' 项改动'), ' 未保存') : el('span', { class: 'sub' }, S.demo ? '示例存档：点上方“打开存档文件夹”，选游戏目录下的 saves 文件夹。' : '没有未保存的改动。')),
    n ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => { S.showLog = !S.showLog; renderDock(); } }, S.showLog ? '收起清单' : '查看清单') : null,
    n ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => { loadBytes(S.bytes, S.fileName, { handle: S.fileHandle, demo: S.demo }); toast('已撤销全部改动。'); } }, '撤销全部') : null,
    !S.demo ? el('button', { class: 'btn ghost', type: 'button', disabled: !n, onclick: () => doSave('download') }, '另存为文件') : null,
    el('button', { class: 'btn primary', type: 'button', disabled: !n || S.demo || !canWrite, title: canWrite ? '' : '用“打开存档文件夹”打开的存档才能直接写回', onclick: () => doSave('write') }, '保存到存档'),
    S.showLog && n ? el('div', { class: 'log' }, [...S.changes.values()].map(c => el('div', {}, el('span', {}, c.label), el('s', {}, String(c.before)), '→', el('ins', {}, String(c.after))))) : null);
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function doSave(mode) {
  let out;
  try {
    out = OYSave.build(S.save);
    const check = OYSave.parse(out);
    if (check.members.length !== S.save.members.length || check._tail.length !== S.save._tail.length) throw new Error('重读校验不一致');
    for (let k = 0; k < check._tail.length; k += 4096) if (check._tail[k] !== S.save._tail[k]) throw new Error('存档尾部数据不一致');
  } catch (e) { toast('没有保存：生成的存档没通过校验（' + e.message + '）。原存档没有被改动。', true); return; }
  try {
    if (mode === 'write') {
      const h = S.fileHandle;
      if (!h) throw new Error('没有可写入的文件');
      if (S.dir) {
        const bak = await S.dir.getFileHandle(`${S.fileName}.${stamp()}.bak`, { create: true });
        const bw = await bak.createWritable(); await bw.write(S.bytes); await bw.close();
      }
      const w = await h.createWritable(); await w.write(out); await w.close();
      toast(S.dir ? `已保存 ${S.fileName}，原存档备份为 ${S.fileName}.${stamp().slice(0, 8)}…bak。回到游戏读这个存档即可。` : `已保存 ${S.fileName}。`);
    } else {
      const a = el('a', { href: URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' })), download: S.fileName.replace(/\.oysav$/i, '') + '-改.oysav' });
      document.body.append(a); a.click(); a.remove();
      toast('已生成新存档文件。把它放进游戏的 saves 文件夹即可读取。');
    }
    loadBytes(out, S.fileName, { handle: S.fileHandle });
    if (S.dir) await scanFolderQuiet();
  } catch (e) { toast('保存失败：' + e.message, true); }
}
async function scanFolderQuiet() { const keep = S.fileName; const list = []; for await (const [name, h] of S.dir.entries()) { if (h.kind === 'file' && /\.oysav$/i.test(name)) { const f = await h.getFile(); const old = S.folderEntries.find(e => e.name === name); list.push(Object.assign({}, old || { name, ok: false }, { handle: h, modified: f.lastModified })); } } list.sort((a, b) => b.modified - a.modified); S.folderEntries = list; S.fileName = keep; renderFolder(); }

// ---------- toast ----------
let toastTimer = 0;
function toast(msg, err, ms) { const t = $('#toast'); t.replaceChildren(msg.nodeType ? msg : document.createTextNode(msg)); t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms || (err ? 9000 : 4500)); }
function hideToast() { $('#toast').hidden = true; }

// ---------- wiring ----------
$('#btnFolder').addEventListener('click', openFolder);
$('#btnFile').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', async ev => { const f = ev.target.files[0]; if (!f) return; S.dir = null; renderFolder(); loadBytes(new Uint8Array(await f.arrayBuffer()), f.name); ev.target.value = ''; });
window.addEventListener('dragover', ev => { ev.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('dragleave', ev => { if (ev.target === document.documentElement || !ev.relatedTarget) document.body.classList.remove('dragging'); });
window.addEventListener('drop', async ev => {
  ev.preventDefault(); document.body.classList.remove('dragging');
  const item = [...ev.dataTransfer.items].find(x => x.kind === 'file'); if (!item) return;
  let handle = null; try { if (item.getAsFileSystemHandle) handle = await item.getAsFileSystemHandle(); } catch (e) { handle = null; }
  const f = item.getAsFile(); if (!f) return;
  S.dir = null; renderFolder(); loadBytes(new Uint8Array(await f.arrayBuffer()), f.name, { handle: handle && handle.kind === 'file' ? handle : null });
});
window.addEventListener('beforeunload', ev => { if (S.changes.size && !S.demo) { ev.preventDefault(); ev.returnValue = ''; } });
if (!window.showDirectoryPicker) $('#btnFolder').title = '需要 Chrome 或 Edge 浏览器';

(async () => {
  try { loadBytes(await gunzip(DEMO_GZ), 'save4.oysav', { demo: true }); }
  catch (e) { toast('示例存档没能载入，请直接打开你的存档。', true); }
})();
</script>
