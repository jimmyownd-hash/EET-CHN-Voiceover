# MAW's dimension maps (devdocs/maw/data/dimension_affixes.yml, zzMaw-Maps.lua): the maps they may open, the monster
# families that fill them, the 33 affixes, the kill drop and the Dimensional Maps quest. An affix's value is
# base + Power x scale; a reduction shows and applies as 100 x (1 - 1 / (1 + value / 100)); a proc chance stops at 100.
format: 1
# The dimension map (renamed "Dimension Map"): its target, affixes and power live in the item's ruleset fields.
map_item: 290
# Kill drops once the Dimensional Maps quest is done (MonsterKilled, zzMaw-Maps.lua:826-939): chance x completed share
# of the dungeons, with bad-luck protection, x monster level / 100 / (maps dropped on the map + 1), x10 from bosses,
# from monsters of this level.
drop: {chance: 0.001, level_required: 100, boss_multiplier: 10}
# Global/zzMaw_DimensionalMapsQuest.lua (MAW aef88884): the first map at this party level; the next tier adds
# first_step, each later step one less down to last_step (80, 110, 139, 167, ... 490, 500); rewarding a tier of
# unlock_tier or more unlocks the kill drops. %d and %s as in MAW.
quest:
  first_tier: 80
  unlock_tier: 500
  first_step: 30
  last_step: 10
  text_too_low: >-
    世界之间的裂隙只为走得足够远的人开启。当你们中有人达到 %d 级时，再来找我。
  text_give: >-
    我透过帷幕看到了彼端改写过的地方。收下这张地图：它将重新开启 %s，那里充满了来自另一维度的生物（地图等级 %d）。清空它，然后回来找我。
  text_not_cleared: 我给你指出的裂隙依然存在。清空它，然后回来找我。
  text_reward: "%s 的裂隙已被封印。收下这份奖励：%d 金币。"
