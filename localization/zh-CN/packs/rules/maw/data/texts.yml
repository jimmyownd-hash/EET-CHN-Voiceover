  21:
    description: >-
      赋予角色飞行的力量！此法术消耗极高且仅限室外，但非常实用。飞行期间（即未接触地面时）每五分钟消耗 1 点魔力。困难及更高难度、以及严苛模式下，攻击怪物会终止飞行（少数地图除外）。
  22:
