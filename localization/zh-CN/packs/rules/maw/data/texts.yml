  225: "治愈并防止疾病与中毒，持续 6 小时。"
  226: "治愈并防止诅咒与麻痹，持续 6 小时。"
  227: "治愈并防止恐惧与疯狂，持续 6 小时。"
  228: "提升你的攻击速度 {haste:1}%，持续 6 小时。"
  229: "提升你的近战伤害 {heroism:1}%，持续 6 小时。"
  230: "提升你的攻击与精准 {stat}%，持续 6 小时。"
  231: "降低所受魔法伤害 {shield:1}% 并获得保全效果，持续 6 小时。\n需要 20 点药力生效。"
  232: "冥想技能获得 <mana>{meditation}</> 点加成，持续 6 小时。"
  233: "持续恢复生命，持续 6 小时。"
  234: "提升你的护甲等级，持续 6 小时。"
  235: "防止溺水伤害，持续 6 小时。\n需要 20 点药力生效。"
  236: "提升物品的耐久，使其更不易损坏。"
  237: "获得 5 层（每 10 点药力 +1 层）魔法防护充能（同法术效果），持续 6 小时。\n50 点药力起还可防止死亡与湮灭。"
