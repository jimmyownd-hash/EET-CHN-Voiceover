  Regeneration:
    append: >-
      当前恢复：每秒 <good>{regen_now:1}</> 点生命（再多 1 点技能为 <good>{regen_next:1}</> 点）。{dragon_leech}
    normal: "随时间恢复生命"
    expert: "恢复量再增加一半"
    master: "恢复量翻倍"
    grandmaster: "恢复量翻倍，生命损失越多恢复越多"
  Meditation:
    append: >-
      当前冥想：每秒 <mana>{med_now:1}</> 点魔力（再多 1 点技能为 <mana>{med_next:1}</> 点）；魔力上次下降 20 秒后翻倍，附近无敌人时再翻两倍。
    normal: "随时间恢复魔力"
    expert: "多四分之一"
    master: "恢复量再增加一半"
    grandmaster: "恢复量翻倍"
  Learning:
    append: >-
      当前技能加成：伤害基础 +<good>{asc_damage_base}</>%、每点伤害 +<good>{asc_damage_scaling}</>%、治疗基础 +<good>{asc_heal_base}</>%、每点治疗 +<good>{asc_heal_scaling}</>%；法力消耗 {asc_mana_change}，控制类法术法力消耗 {asc_cc_mana_change}，施法时间 +<bad>{asc_cast}</>%。
  Perception:
    normal: "{table}；陷阱与熔岩伤害降低 10%"
    expert: "{table}；陷阱与熔岩伤害降低 30%"
    master: "{table}；陷阱与熔岩伤害降低 50%"
    grandmaster: "{table}；陷阱与熔岩伤害降低 70%"
  Merchant:
    append: >-
      队伍中最好的商人定价每笔交易：技能乘以掌握度，再加个性；宗师级或总计 45 点时按成本买卖。声望不影响价格。
  IdentifyMonster:
    append: >-
      当队伍最佳技能乘以掌握度达到怪物等级减去队伍平均等级时（或有人达到宗师级），队伍即可识别该怪物；最佳掌握度决定学到多少信息。
  Alchemy:
    append: >-
      大师级在 1% 的被杀怪物身上发现随机试剂，宗师级为 2%。
      # zzAlchemy.lua:708-709.
    master: "允许制作白色药剂。混合时药力每技能点提升至 1.5。"
    grandmaster: "允许制作黑色药剂。混合时药力每技能点提升至 2，并每技能点使药剂持续时间增加 6 分钟。允许怪物掉落无限药剂，其药力由炼金术等级决定。"
  Cover:
    append: >-
      当前掩护几率：<good>{cover_chance}</>%。掌握度在 <value>{ladder_expert}</>、<value>{ladder_master}</>、<value>{ladder_grandmaster}</> 点自行达成。在技能页按 P 切换：{cover_state}。
  ManaShield:
    append: >-
      现在每点魔力吸收 <mana>{mana_efficiency:2}</> 点伤害。在技能页按 M 切换：{mana_shield_state}。
  Enlightenment:
    append: >-
      掌握度在 <value>{ladder_expert}</>、<value>{ladder_master}</>、<value>{ladder_grandmaster}</> 点自行达成。
  Retaliation:
    append: >-
      掌握度在 <value>{ladder_expert}</>、<value>{ladder_master}</>、<value>{ladder_grandmaster}</> 点自行达成。其伤害为技能乘以两个系数：近战之力 <bad>{retaliation_power}</> 与活力 <bad>{retaliation_vitality}</>，当前 <bad>{retaliation_damage}</> 点伤害。平衡之力与活力收益最高。
class_skills:
  death_knight:
    WaterMagic:
      description: >-
        寒冰，仅限死亡骑士：每点近战伤害 +0.5、+0.75 或 +1（新手、专家、大师；宗师不再追加）且攻击速度每点 +1%。其掌握度解锁寒冰之触、水上行走、霜咬与冰弹。
      normal: "效果随法术而异"
      expert: "效果随法术而异"
      master: "效果随法术而异"
      grandmaster: "效果随法术而异"
    BodyMagic:
      description: >-
        鲜血，仅限死亡骑士：所受物理伤害降低 <good>{school_cut:1}</>%，你的攻击吸取生命。其掌握度解锁吸血之触、再生、窒息与高级吸血之触。
      normal: "效果随法术而异"
      expert: "效果随法术而异"
      master: "效果随法术而异"
      grandmaster: "效果随法术而异"
    DarkMagic:
      description: >-
        邪恶，仅限死亡骑士：每点近战伤害 +0.5、+0.75 或 +1（新手、专家、大师）且所受魔法伤害降低 <good>{school_cut:1}</>%。其掌握度解锁吸血光环、死亡缠绕、死亡之握与死亡吐息。
      normal: "效果随法术而异"
      expert: "效果随法术而异"
      master: "效果随法术而异"
      grandmaster: "效果随法术而异"
  assassin:
    FireMagic:
      description: >-
        战斗让刺客能撑过漫长的战斗：每次攻击有 10% 几率（每点 +1%）恢复 15 点能量。
      normal: "近战攻击消耗 45 能量"
      expert: "近战攻击消耗 40 能量"
      master: "近战攻击消耗 35 能量"
      grandmaster: "近战攻击消耗 30 能量"
    AirMagic:
      description: >-
        潜行：每次消耗能量的攻击获得一层（最多 5 层）增益，每点提升攻击速度 0.5%，击杀恢复能量。
      normal: "击杀怪物恢复 10 能量"
      expert: "击杀怪物恢复 15 能量"
      master: "击杀怪物恢复 20 能量"
      grandmaster: "击杀怪物恢复 25 能量"
    WaterMagic:
      description: >-
        毒术：每次攻击额外造成目标生命值 0.1%（每点）的水系伤害，能量恢复更快。
      normal: "每秒恢复 8 能量"
      expert: "每秒恢复 10 能量"
      master: "每秒恢复 12 能量"
      grandmaster: "每秒恢复 14 能量"
    EarthMagic:
      description: >-
        刺杀：消耗能量的攻击与法术按掌握度每点额外造成 2、3、4 或 5 点伤害，目标附近每多一个怪物（最多 4 个）伤害降低 20%。此类攻击为攻击法术积攒连击点；箭矢触发频率减半。更高等级还提供更多能量。
      normal: "最大能量 +10"
      expert: "最大能量 +20"
      master: "最大能量 +30"
      grandmaster: "最大能量 +40"
  dragon:
    Unarmed:
      description: >-
        龙用尖牙对敌人造成可怕伤害。伤害为 30 + 每级 2（最高 {dragon_level_cap} 级）；尖牙技能按掌握度与技能等级的百分比提升伤害。每点还使撕咬慢 1.5% 但强 1.5%，因此更少、更重的撕咬在相同时间内造成同等伤害。
      normal: "每点 +2 攻击、+4% 伤害"
      expert: "每点 +3 攻击、+6% 伤害"
      master: "每点 +4 攻击、+8% 伤害"
      grandmaster: "每点 +5 攻击、+10% 伤害"
    Dodging:
      description: >-
        龙鳞坚硬得足以充当天然护甲：40 + 每级 1 点护甲等级（最高 {dragon_level_cap} 级）。鳞甲技能按百分比提升该坚韧度与魔法抗性（每点）。龙无法闪避。
      normal: "每点 +2% 护甲等级、+1% 抗性"
      expert: "每点 +3% 护甲等级、+1% 抗性"
      master: "每点 +3% 护甲等级、+2% 抗性"
      grandmaster: "每点 +4% 护甲等级、+3% 抗性"
  shaman:
    FireMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。近战攻击以 <good>{school_share:1}</>% 燃烧怪物的生命值。
    AirMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。所受全部伤害降低 <good>{school_cut:1}</>%。
    WaterMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。每次受击在抗性结算后额外减少 <good>{school_flat_cut}</> 点。
    EarthMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。近战伤害按掌握度每点 +0.5、+1、+1.5 或 +2。
    SpiritMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。近战伤害 +<good>{school_percent:1}</>%。
    MindMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。近战攻击恢复 <mana>{mind_sp}</> 点魔力。
    BodyMagic:
      append: >-
        萨满：每 7 点技能为飞升 +1。近战攻击恢复 <good>{body_hp}</> 点生命。
  seraphim:
    SpiritMagic:
      append: >-
        炽天使：精神抵御轻击并削弱重击：每次受击在抗性结算后减免 <good>{school_flat_cut}</> 点。
    MindMagic:
      append: >-
        炽天使：心灵为每次攻击附加 <good>{school_damage}</> 点伤害，随力量、武器速度与武器伤害倍率增长。
      normal: "每点 +1 伤害"
      expert: "每点 +1.5 伤害"
      master: "每点 +2 伤害"
      grandmaster: "每点 +2 伤害"
    BodyMagic:
      append: >-
        炽天使：身体在每次攻击时治疗队伍中生命比例最低的成员，随个性与武器速度增长。当前治疗：<good>{seraph_heal}</> 点生命。
      normal: "近战攻击治疗"
      expert: "治疗效果翻倍"
      master: "治疗效果三倍"
      grandmaster: "治疗效果三倍"
    LightMagic:
      append: >-
        炽天使：光明加速炽天使的攻击，并减轻剑刃重量使双手剑可单手使用，空出另一只手持盾。
      normal: "每点 +0.5% 攻击速度"
      expert: "每点 +1% 攻击速度"
      master: "每点 +1.5% 攻击速度"
      grandmaster: "每点 +2% 攻击速度"
  elementalist:
    FireMagic:
      append: >-
        从快捷栏或攻击法术施放的攻击法术会积攒层数并将其转化为同类的另一已知法术：单体、散弹或范围。在技能页按 R 切换轮转；当前为 {rotation}。元素使通过施法学习法术：距下一个火焰法术还有 <good>{elemental_progress:1}</>%。
    AirMagic:
      append: >-
        从快捷栏或攻击法术施放的攻击法术会积攒层数并将其转化为同类的另一已知法术：单体、散弹或范围。在技能页按 R 切换轮转；当前为 {rotation}。元素使通过施法学习法术：距下一个空气法术还有 <good>{elemental_progress:1}</>%。
    WaterMagic:
      append: >-
        从快捷栏或攻击法术施放的攻击法术会积攒层数并将其转化为同类的另一已知法术：单体、散弹或范围。在技能页按 R 切换轮转；当前为 {rotation}。元素使通过施法学习法术：距下一个水系法术还有 <good>{elemental_progress:1}</>%。
    EarthMagic:
      append: >-
        从快捷栏或攻击法术施放的攻击法术会积攒层数并将其转化为同类的另一已知法术：单体、散弹或范围。在技能页按 R 切换轮转；当前为 {rotation}。元素使通过施法学习法术：距下一个土系法术还有 <good>{elemental_progress:1}</>%。
# Stat popups (zzMaw-Stats.lua BuildStatInformationBox), keyed by the character screen's stat names. `append` adds a
# paragraph to the stat table's text, `description` replaces it. Numbers are measured against the party's total level
# (<value>{reference_level}</>), as MAW's are:
#   might_bonus, spell_bonus, spell_crit_damage, crit_damage, crit_chance   percents
#   heal_bonus, cost_cut      Personality's healing bonus and spell cost cut, in percent
#   endurance_bonus           the percent of maximum hit points Endurance adds; endurance_levels and
#                             personality_levels, the levels' worth of hit points or spell points their effects add
#   attack_haste, spell_haste the percents Speed takes off attack and spell recovery
#   avoid_chance              the chance a physical blow misses because of Speed
#   hit_chance                the chance a melee blow lands
#   physical_cut, total_cut   the percent of a physical blow armour takes off, and with avoiding blows
#   fire_cut ... body_cut     the percent each resistance takes off a hit
#   hp_regen, sp_regen        hit points and spell points regained per second (faster out of combat)
#   levels_mm6, levels_mm7, levels_mm8, levels_total   the levels banked in each world
stats:
  Might:
    append: "<value>近战与弓类伤害</> +<good>{might_bonus:1}</>%。"
  Intellect:
    description: >-
      <value>智力</>代表角色推理与理解复杂抽象概念的能力。<mana>法术伤害</>随<value>智力</>与<value>个性</>中较高者增长，<mana>法术暴击伤害</>随<value>智力</>增长。
    append: "<mana>法术伤害</> +<good>{spell_bonus:1}</>%。<mana>法术暴击伤害</> +<good>{spell_crit_damage:1}</>%。"
  Personality:
    description: >-
      <value>个性</>代表角色的意志力与个人魅力。<mana>最大魔力</>、<mana>法术消耗</>与<good>治疗能力</>均基于<value>个性</>。
    append: >-
      <good>治疗</> +<good>{heal_bonus:1}</>%。<mana>法术消耗</> -<good>{cost_cut:1}</>%。个性额外提供 <value>{personality_levels}</> 级等值的魔力。
  Endurance:
    append: >-
      <good>生命</> +<good>{endurance_bonus:1}</>%，活力额外提供 <value>{endurance_levels}</> 级等值的生命。
  Accuracy:
    append: "<value>近战与弓类暴击伤害</> +<good>{crit_damage:1}</>%。"
  Speed:
    append: >-
      <value>速度</>改变攻击恢复 <good>{attack_haste:1}</>% 与法术恢复 <good>{spell_haste}</>%。等级 <value>{reference_level}</> 怪物的物理攻击有 <good>{avoid_chance:1}</>% 落空。宗师级闪避可躲开 <good>{dodge_chance:1}</>% 的怪物攻击。
  Luck:
    append: "对等级 <value>{reference_level}</> 怪物的<value>暴击率</>：<good>{crit_chance:1}</>%。"
  HitPoints:
    append: >-
      每秒恢复 <good>{hp_regen:1}</> 点生命；受到最后一次攻击 20 秒后翻倍，附近无敌人时再翻两倍。
  SpellPoints:
    append: >-
      每秒恢复 <mana>{sp_regen:1}</> 点魔力；魔力上次下降 20 秒后翻倍，附近无敌人时再翻两倍。
  ArmorClass:
    append: >-
      面对等级 <value>{reference_level}</> 的怪物，护甲削减物理攻击 <good>{physical_cut:1}</>%；算上速度躲开的攻击，平均 <good>{total_cut:1}</>%。
  Attack:
    append: "对等级 <value>{reference_level}</> 怪物的<value>近战命中率</>：<good>{hit_chance:1}</>%。"
  Level:
    append: >-
      <value>累计等级</>：总计 <value>{levels_total:1}</>；恩洛斯 <value>{levels_mm6:1}</>、安塔加里奇 <value>{levels_mm7:1}</>、贾达美 <value>{levels_mm8:1}</>。怪物随其他世界累计的等级成长：恩洛斯强化等级 <value>{bolster_mm6}</>、安塔加里奇 <value>{bolster_mm7}</>、贾达美 <value>{bolster_mm8}</>。
  FireResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，火焰抗性削减火焰攻击 <good>{fire_cut:1}</>%。"
  AirResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，空气抗性削减空气攻击 <good>{air_cut:1}</>%。"
  WaterResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，水系抗性削减水系攻击 <good>{water_cut:1}</>%。"
  EarthResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，土系抗性削减土系攻击 <good>{earth_cut:1}</>%。"
  MindResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，心智抗性削减心灵攻击 <good>{mind_cut:1}</>%。"
  BodyResistance:
    append: "面对等级 <value>{reference_level}</> 的怪物，肢体抗性削减身体攻击 <good>{body_cut:1}</>%。"
# Item descriptions, keyed by item id or by a kind of item (gem); they replace the item table's notes.
# Potions (zzAlchemy.lua:429-541, Tooltip.lua:83-130), numbers at the potion's power:
#   heal_small, mana_small, heal_large, mana_large   what Healing, Magic, Divine Restoration and Divine Mastery restore
#   haste, heroism, shield                            the potion's copy of the aura, in percent
#   stat, stat_light                                  the aura's stat percent (Day of the Gods' wider span)
#   protection                                        Day of Protection's resistance at the potion's power
#   meditation                                        the Meditation skill bonus
#   step, skill_points, best_step, best_skill_points  Transcendence's step at this power and the best one drunk
# Gems (Tooltip.lua:141-163): tier, max_power, skill_max, two_handed, body, helm, ring (the caps by item class),
# drop_max_tier, tiers, combine.
items:
  gem: >-
      一种特殊宝石，可提升物品的附魔强度：+3，技能 +1（在工艺台对带基础附魔的物品使用）。
      最大魔力是原始物品可骰出的最高附魔强度，随宝石等级缩放。

      {combine} 颗同等级宝石在工艺台合成为 1 颗下一等级宝石。宝石最多掉落到 {drop_max_tier} 级：更高等级只能通过合成获得。

      等级: <value>{tier}</>
      最大魔力: <value>{max_power}</>
      技能最大魔力: <value>{skill_max}</>

      物品修饰:
      双手武器: <value>{two_handed}</>
      身体护甲: <value>{body}</>
      头盔-靴子-手套-弓: <value>{helm}</>
      戒指: <value>{ring}</>
  222: "<value>恢复 {heal_small} 点生命</>"
  223: "<value>恢复 {mana_small} 点魔力</>"
