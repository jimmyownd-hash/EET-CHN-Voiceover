    expert: "最多击中 2 个怪物"
    master: "最多击中 3 个怪物"
    grandmaster: "最多击中 4 个怪物"
  19:
    master: "持续 22.5 分钟 + 每点技能 1.5 分钟"
    grandmaster: "持续 45 分钟 + 每点技能 3 分钟"
  20:
