  # MAW's collision shrink for monsters that get stuck (zzMaw-Monsters.lua:3615-3630): Height and Radius x0.75 for the
  # Behemoths, the minotaurs and the MM6 demons. MAW's 0-based list misses the third MM6 minotaur and shrinks Merchant C
  # instead; this follows its comment (DEVIATIONS; audit DAT-4).
  - table: monster_descriptors.txt
    mode: override
    path: content/monster_descriptors_patch.txt
    keyColumn: 0
    headerRow: 1
